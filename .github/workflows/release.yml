name: TunnelGuard Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name of the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_description:
        description: 'Detailed description / release notes'
        required: true
        default: 'TunnelGuard initial stable release.'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Run Release Unit Tests
      run: ./gradlew testReleaseUnitTest

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Set up Android SDK and Sign Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "ERROR: KEYSTORE_BASE64 secret is not defined or is empty! Cannot proceed with signing."
          exit 1
        fi

        # Reconstruct Keystore from Base64
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

        # Locate APK and apksigner
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          echo "ERROR: Could not find build release APK!"
          exit 1
        fi

        # Align the APK before signing
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$UNSIGNED_APK" TunnelGuard-release-aligned.apk

        # Sign APK with apksigner
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          --out TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk \
          TunnelGuard-release-aligned.apk

        # Verify Signature
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk

        # Generate Checksums
        sha256sum TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk > TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk.sha256

        # Write build metadata
        echo "Build Metadata" > metadata.txt
        echo "Release Version: ${{ github.event.inputs.release_name }}" >> metadata.txt
        echo "Commit SHA: ${{ github.sha }}" >> metadata.txt
        echo "Build Time: $(date -u)" >> metadata.txt

        # Securely remove private files
        rm -f release.keystore
        rm -f TunnelGuard-release-aligned.apk
        echo "Signing and verification completed successfully."

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.event.inputs.release_name }}" \
          --title "${{ github.event.inputs.release_name }}" \
          --notes "${{ github.event.inputs.release_description }}" \
          TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk \
          TunnelGuard-v${{ github.event.inputs.release_name }}-release.apk.sha256 \
          metadata.txt
