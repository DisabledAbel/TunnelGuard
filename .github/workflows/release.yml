name: TunnelGuard Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name of the release (e.g., v1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Validate Release Name Input and Calculate Version Metadata
      env:
        RELEASE_NAME: ${{ inputs.release_name || github.ref_name }}
        RELEASE_ACTOR: ${{ github.actor }}
        # Keep the repository owner authorized when the optional override has not
        # been configured. Additional publishers must still be explicitly listed
        # in the repository variable.
        TRUSTED_RELEASE_ACTORS: ${{ vars.TRUSTED_RELEASE_ACTORS || 'DisabledAbel' }}
      run: |
        if [[ ! "$RELEASE_NAME" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "ERROR: Invalid stable version: $RELEASE_NAME. Must be a stable semver (e.g., 1.0.0 or v1.0.0)."
          exit 1
        fi

        # Clean leading 'v'
        CLEAN_VERSION_NAME=$(echo "$RELEASE_NAME" | sed 's/^v//')

        # Extract components for version code calculation
        IFS='.' read -r -a parts <<< "$CLEAN_VERSION_NAME"
        major="${parts[0]}"
        minor="${parts[1]}"
        patch="${parts[2]}"

        # Reserve four decimal digits for patch and three for minor. The bounds
        # make this mapping one-to-one and keep it within Google Play's limit.
        major_num=$((10#$major))
        minor_num=$((10#$minor))
        patch_num=$((10#$patch))
        if (( major_num > 209 || minor_num > 999 || patch_num > 9999 )); then
          echo "ERROR: Version components exceed supported bounds: major <= 209, minor <= 999, patch <= 9999."
          exit 1
        fi

        VERSION_CODE=$((major_num * 10000000 + minor_num * 10000 + patch_num))
        if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
          echo "ERROR: Android versionCode $VERSION_CODE must be between 1 and 2100000000."
          exit 1
        fi

        if [[ -z "$TRUSTED_RELEASE_ACTORS" ]]; then
          echo "ERROR: TRUSTED_RELEASE_ACTORS must list the GitHub users allowed to publish stable releases."
          exit 1
        fi

        trusted=false
        IFS=',' read -r -a actors <<< "$TRUSTED_RELEASE_ACTORS"
        for actor in "${actors[@]}"; do
          actor="${actor//[[:space:]]/}"
          if [[ "${actor,,}" == "${RELEASE_ACTOR,,}" ]]; then
            trusted=true
            break
          fi
        done
        if [[ "$trusted" != "true" ]]; then
          echo "ERROR: $RELEASE_ACTOR is not authorized to publish stable releases."
          exit 1
        fi

        echo "Valid SemVer version name: $CLEAN_VERSION_NAME"
        echo "Calculated version code: $VERSION_CODE"

        # Persist versions into GitHub environment
        echo "CLEAN_VERSION_NAME=$CLEAN_VERSION_NAME" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

    - name: Check for Existing Stable Release
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      run: scripts/check_stable_release.sh "$GITHUB_REPOSITORY" "v${CLEAN_VERSION_NAME}"

    - name: Set up JDK 17
      if: env.STABLE_RELEASE_EXISTS != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      if: env.STABLE_RELEASE_EXISTS != 'true'
      run: chmod +x gradlew

    - name: Run Release Unit Tests
      if: env.STABLE_RELEASE_EXISTS != 'true'
      env:
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
      run: ./gradlew testReleaseUnitTest -PversionName="$CLEAN_VERSION_NAME" -PversionCode="$VERSION_CODE"

    - name: Build Release APK
      if: env.STABLE_RELEASE_EXISTS != 'true'
      env:
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
      run: ./gradlew assembleRelease -PversionName="$CLEAN_VERSION_NAME" -PversionCode="$VERSION_CODE"

    - name: Verify Official Release Identity
      if: env.STABLE_RELEASE_EXISTS != 'true'
      run: |
        RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
        if [ -z "$RELEASE_APK" ]; then
          echo "ERROR: Could not find the release APK."
          exit 1
        fi
        BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$RELEASE_APK")
        echo "$BADGING" | head -n 2
        echo "$BADGING" | grep -q "package: name='com.tunnelguard.app'"
        echo "$BADGING" | grep -q "application-label:'TunnelGuard'"
        if echo "$BADGING" | grep -qi 'alpha'; then
          echo "ERROR: The stable release APK contains alpha identity metadata."
          exit 1
        fi

    - name: Set up Android SDK and Sign Release APK
      if: env.STABLE_RELEASE_EXISTS != 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
      run: |
        # Android only accepts an in-place update when the new APK is signed by the
        # same certificate as the installed APK. Never generate a temporary key here:
        # doing so gives every release a different identity and Android reports the
        # resulting upgrade failure as an existing-package conflict.
        missing_secrets=()
        for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SIGNER_SHA256; do
          if [ -z "${!secret_name}" ]; then
            missing_secrets+=("$secret_name")
          fi
        done
        if [ "${#missing_secrets[@]}" -ne 0 ]; then
          echo "ERROR: Stable release signing credentials are required. Missing: ${missing_secrets[*]}"
          echo "Refusing to create an APK that cannot update existing TunnelGuard installations."
          exit 1
        fi

        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        keytool -list \
          -keystore release.keystore \
          -alias "$KEY_ALIAS" \
          -storepass "$KEYSTORE_PASSWORD" >/dev/null

        # Locate APK and apksigner
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          echo "ERROR: Could not find build release APK!"
          exit 1
        fi

        # Align the APK before signing
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$UNSIGNED_APK" TunnelGuard-release-aligned.apk

        # Sign APK with apksigner (no extra literal 'v' before version)
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          --out "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" \
          TunnelGuard-release-aligned.apk

        # Verify the APK, then pin its signer before anything can be published.
        verification_output=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify \
          --verbose \
          --print-certs \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk")
        echo "$verification_output"

        actual_signer_sha256=$(echo "$verification_output" |
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
          head -n 1 |
          tr -d '[:space:]:' |
          tr '[:upper:]' '[:lower:]')
        expected_signer_sha256=$(echo "$EXPECTED_SIGNER_SHA256" |
          tr -d '[:space:]:' |
          tr '[:upper:]' '[:lower:]')

        if [ -z "$actual_signer_sha256" ] || [ "$actual_signer_sha256" != "$expected_signer_sha256" ]; then
          echo "ERROR: Release APK signer SHA-256 does not match EXPECTED_SIGNER_SHA256."
          echo "Actual:   ${actual_signer_sha256:-not found}"
          exit 1
        fi
        echo "Release APK signer matches the protected certificate digest."

        # Generate Checksums
        sha256sum "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" > "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk.sha256"

        # Write build metadata
        echo "Build Metadata" > metadata.txt
        echo "Release Version: ${CLEAN_VERSION_NAME}" >> metadata.txt
        echo "Commit SHA: ${{ github.sha }}" >> metadata.txt
        echo "Build Time: $(date -u)" >> metadata.txt

        # Securely remove private files
        rm -f release.keystore
        rm -f TunnelGuard-release-aligned.apk
        echo "Signing and verification completed successfully."

    - name: Generate Automatic Release Description
      if: env.STABLE_RELEASE_EXISTS != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        RELEASE_DESCRIPTION: ${{ github.event.inputs.release_description }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        chmod +x scripts/generate_release_notes.sh
        ./scripts/generate_release_notes.sh

    - name: Create GitHub Release
      if: env.STABLE_RELEASE_EXISTS != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
      run: |
        # Only explicitly replace Latest when this version is newer than every
        # published stable release. Older backfills must not move the Latest marker.
        highest_major=-1
        highest_minor=-1
        highest_patch=-1
        published_stable_tags=$(gh api --paginate repos/{owner}/{repo}/releases \
          --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
        while IFS= read -r tag; do
          if [[ "$tag" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            tag_major=$((10#${BASH_REMATCH[1]}))
            tag_minor=$((10#${BASH_REMATCH[2]}))
            tag_patch=$((10#${BASH_REMATCH[3]}))
            if (( tag_major > highest_major ||
                  (tag_major == highest_major && tag_minor > highest_minor) ||
                  (tag_major == highest_major && tag_minor == highest_minor && tag_patch > highest_patch) )); then
              highest_major=$tag_major
              highest_minor=$tag_minor
              highest_patch=$tag_patch
            fi
          fi
        done <<< "$published_stable_tags"

        IFS='.' read -r release_major release_minor release_patch <<< "$CLEAN_VERSION_NAME"
        release_major=$((10#$release_major))
        release_minor=$((10#$release_minor))
        release_patch=$((10#$release_patch))
        latest_args=()
        if (( release_major > highest_major ||
              (release_major == highest_major && release_minor > highest_minor) ||
              (release_major == highest_major && release_minor == highest_minor && release_patch > highest_patch) )); then
          latest_args+=(--latest)
        fi

        # Use quoted shell variables and read release notes from the generated file.
        gh release create "v${CLEAN_VERSION_NAME}" \
          --title "v${CLEAN_VERSION_NAME}" \
          "${latest_args[@]}" \
          --notes-file generated_description.txt \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk.sha256" \
          metadata.txt
