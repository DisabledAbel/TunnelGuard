name: TunnelGuard Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name of the release (e.g., v1.0.0)'
        required: true
        default: '1.0.0'
      publish_release:
        description: 'Sign and publish the release (requires the stable signing secrets)'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Validate Release Name Input and Calculate Version Metadata
      env:
        RELEASE_NAME: ${{ inputs.release_name || github.ref_name }}
        PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
      run: |
        if [[ ! "$RELEASE_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: Invalid stable version: $RELEASE_NAME. Must be a stable semver (e.g., 1.0.0 or v1.0.0)."
          exit 1
        fi

        # Clean leading 'v'
        CLEAN_VERSION_NAME=$(echo "$RELEASE_NAME" | sed 's/^v//')

        # Extract components for version code calculation
        IFS='.' read -r -a parts <<< "$CLEAN_VERSION_NAME"
        major="${parts[0]}"
        minor="${parts[1]}"
        patch="${parts[2]}"

        # Remove any pre-release suffixes from patch component
        patch_num=$(echo "$patch" | cut -d'-' -f1)

        # Build-safe version code calculation
        VERSION_CODE=$((major * 10000 + minor * 100 + patch_num))

        echo "Valid SemVer version name: $CLEAN_VERSION_NAME"
        echo "Calculated version code: $VERSION_CODE"

        # Persist versions into GitHub environment
        echo "CLEAN_VERSION_NAME=$CLEAN_VERSION_NAME" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
        echo "PUBLISH_RELEASE=$PUBLISH_RELEASE" >> "$GITHUB_ENV"

    - name: Run Release Unit Tests
      env:
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
      run: ./gradlew testReleaseUnitTest -PversionName="$CLEAN_VERSION_NAME" -PversionCode="$VERSION_CODE"

    - name: Build Release APK
      env:
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
      run: ./gradlew assembleRelease -PversionName="$CLEAN_VERSION_NAME" -PversionCode="$VERSION_CODE"

    - name: Set up Android SDK and Sign Release APK
      if: ${{ env.PUBLISH_RELEASE == 'true' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
      run: |
        # Android only accepts an in-place update when the new APK is signed by the
        # same certificate as the installed APK. Never generate a temporary key here:
        # doing so gives every release a different identity and Android reports the
        # resulting upgrade failure as an existing-package conflict.
        missing_secrets=()
        for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SIGNER_SHA256; do
          if [ -z "${!secret_name}" ]; then
            missing_secrets+=("$secret_name")
          fi
        done
        if [ "${#missing_secrets[@]}" -ne 0 ]; then
          echo "ERROR: Stable release signing credentials are required. Missing: ${missing_secrets[*]}"
          echo "Refusing to create an APK that cannot update existing TunnelGuard installations."
          exit 1
        fi

        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        keytool -list \
          -keystore release.keystore \
          -alias "$KEY_ALIAS" \
          -storepass "$KEYSTORE_PASSWORD" >/dev/null

        # Locate APK and apksigner
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          echo "ERROR: Could not find build release APK!"
          exit 1
        fi

        # Align the APK before signing
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$UNSIGNED_APK" TunnelGuard-release-aligned.apk

        # Sign APK with apksigner (no extra literal 'v' before version)
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          --out "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" \
          TunnelGuard-release-aligned.apk

        # Verify the APK, then pin its signer before anything can be published.
        verification_output=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify \
          --verbose \
          --print-certs \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk")
        echo "$verification_output"

        actual_signer_sha256=$(echo "$verification_output" |
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
          head -n 1 |
          tr -d '[:space:]:' |
          tr '[:upper:]' '[:lower:]')
        expected_signer_sha256=$(echo "$EXPECTED_SIGNER_SHA256" |
          tr -d '[:space:]:' |
          tr '[:upper:]' '[:lower:]')

        if [ -z "$actual_signer_sha256" ] || [ "$actual_signer_sha256" != "$expected_signer_sha256" ]; then
          echo "ERROR: Release APK signer SHA-256 does not match EXPECTED_SIGNER_SHA256."
          echo "Actual:   ${actual_signer_sha256:-not found}"
          exit 1
        fi
        echo "Release APK signer matches the protected certificate digest."

        # Generate Checksums
        sha256sum "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" > "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk.sha256"

        # Write build metadata
        echo "Build Metadata" > metadata.txt
        echo "Release Version: ${CLEAN_VERSION_NAME}" >> metadata.txt
        echo "Commit SHA: ${{ github.sha }}" >> metadata.txt
        echo "Build Time: $(date -u)" >> metadata.txt

        # Securely remove private files
        rm -f release.keystore
        rm -f TunnelGuard-release-aligned.apk
        echo "Signing and verification completed successfully."

    - name: Upload Unsigned Release Candidate
      if: ${{ env.PUBLISH_RELEASE != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: TunnelGuard-v${{ env.CLEAN_VERSION_NAME }}-unsigned
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 7

    - name: Generate Automatic Release Description
      if: ${{ env.PUBLISH_RELEASE == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        RELEASE_DESCRIPTION: ${{ github.event.inputs.release_description }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        chmod +x scripts/generate_release_notes.sh
        ./scripts/generate_release_notes.sh

    - name: Create GitHub Release
      if: ${{ env.PUBLISH_RELEASE == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        CLEAN_VERSION_NAME: ${{ env.CLEAN_VERSION_NAME }}
      run: |
        # Use quoted shell variables and read release notes from the generated file
        gh release create "v${CLEAN_VERSION_NAME}" \
          --title "v${CLEAN_VERSION_NAME}" \
          --latest \
          --notes-file generated_description.txt \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk" \
          "TunnelGuard-v${CLEAN_VERSION_NAME}-release.apk.sha256" \
          metadata.txt
